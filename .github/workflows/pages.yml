name: Publish BalconyFarm to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble complete static site
        run: python3 scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for branch-based Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
          FARM_REPOSITORY: ${{ github.repository }}
          FARM_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['FARM_REPOSITORY'] + '/actions/runs?head_sha=' + os.environ['FARM_COMMIT']
          started = time.monotonic()
          while time.monotonic() - started < 300:
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  runs = json.load(response)['workflow_runs']
              legacy = [run for run in runs if run['name'] == 'pages build and deployment']
              if legacy and all(run['status'] == 'completed' for run in legacy):
                  print('Branch publication finished. Publishing the complete site last.')
                  break
              if not legacy and time.monotonic() - started > 30:
                  print('No branch-based publication is configured.')
                  break
              time.sleep(5)
          else:
              raise RuntimeError('Branch publication is still active; avoiding a conflicting deployment.')
          PY
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4
